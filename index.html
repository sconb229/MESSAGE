<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メッセージ</title>

    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f5f5;
            font-family:sans-serif;
            text-align:center;
        }

        .box{
            max-width:900px;
            padding:30px;
        }

        .warning{
            color:red;
            font-size:48px;
            font-weight:bold;
            margin-bottom:20px;
        }

        h1{
            font-size:36px;
            color:#333;
            line-height:1.6;
            font-weight:normal;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="warning">
            不正を検出しました。
        </div>

        <h1>
            学校外の位置情報が検出されました。<br>
            担当教員に通知されます。<br><br>

            ご不明な点がございましたら、<br>
            学びステーションまでお越しください。<br><br>

            RITSUMEIKAN UNIVERSITY
        </h1>

    </div>

</body>
</html>
