<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ</title>

    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f5f5;
            font-family:sans-serif;
            text-align:center;
        }

        .box{
            max-width:900px;
            padding:40px;
        }

        .warning{
            color:#d00000;
            font-size:50px;
            font-weight:bold;
            margin-bottom:30px;
        }

        h1{
            color:#333;
            font-size:34px;
            font-weight:normal;
            line-height:1.7;
            margin:0;
        }

        .logo{
            width:30px
            margin-top:35px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="warning">
        不正を検出しました。
    </div>

    <h1>
        学校外の位置情報が検出されました。<br>
        担当教員に通知されます。<br><br>

        ご不明な点がございましたら、<br>
        学びステーションまでお越しください。
    </h1>

    <img src="logo.png" class="logo" alt="立命館大学ロゴ">

</div>

</body>
</html>
