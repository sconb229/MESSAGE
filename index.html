<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ</title>

    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#ffffff;
            font-family:sans-serif;
            text-align:center;
        }

        .box{
            max-width:900px;
            padding:40px;
        }

        .warning{
            color:#d00000;
            font-size:50px;
            font-weight:bold;
            margin-bottom:30px;
        }

        h1{
            color:#333;
            font-size:34px;
            font-weight:normal;
            line-height:1.7;
            margin:0;
        }

        .logo{
            width:20px
            margin-top:35px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="warning">
        不正を検出しました。
    </div>

    <h1>
        学校外から出席確認用QRコードが読み込まれました。本件は記録され、担当教員へ通知されます。正当な理由がある場合は、学びステーションまでお問い合わせください。
    </h1>

    <img src="logo.png" class="logo" alt="立命館大学ロゴ">

</div>

</body>
</html>
